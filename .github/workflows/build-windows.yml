name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller
      - name: Syntax check
        run: python -m py_compile src/rlbot_adapter.py
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RLBotEpicAdapter src/rlbot_adapter.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RLBotEpicAdapter-windows
          path: dist/RLBotEpicAdapter.exe
          if-no-files-found: error
          retention-days: 30
